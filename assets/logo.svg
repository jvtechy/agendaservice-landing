<svg viewBox="0 0 320 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgendaService">
  <defs>
    <linearGradient id="as-green" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="as-gold" x1="0" y1="0" x2="12" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="as-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon: calendar + check -->
  <g filter="url(#as-glow)">
    <rect x="2" y="6" width="40" height="36" rx="10" fill="#1E1E1E" stroke="url(#as-green)" stroke-width="2"/>
    <path d="M2 18H42" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="10" y="3" width="4" height="8" rx="2" fill="url(#as-green)"/>
    <rect x="30" y="3" width="4" height="8" rx="2" fill="url(#as-green)"/>

    <rect x="8" y="22" width="10" height="8" rx="2" fill="#2D2D2D" stroke="#404040" stroke-width="1"/>
    <rect x="24" y="22" width="10" height="8" rx="2" fill="#2D2D2D" stroke="#404040" stroke-width="1"/>
    <rect x="8" y="33" width="10" height="6" rx="1.5" fill="#2D2D2D" stroke="#404040" stroke-width="1"/>
    <rect x="24" y="33" width="10" height="6" rx="1.5" fill="url(#as-green)" fill-opacity="0.25" stroke="#10B981" stroke-width="1.2"/>

    <path d="M26.5 25.5L28.2 27.5L31.5 23.5" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Spark accent -->
    <circle cx="38" cy="12" r="3" fill="url(#as-gold)"/>
  </g>

  <!-- Wordmark -->
  <text x="54" y="33" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
    Agenda<tspan fill="#10B981">Service</tspan>
  </text>
</svg>
